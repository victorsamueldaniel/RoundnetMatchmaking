name: Build

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.artifact_suffix }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_suffix: win_x64
            python_version: "3.11"
          - os: macos-latest
            artifact_suffix: mac_arm64
            python_version: "3.11"
          - os: macos-13
            artifact_suffix: mac_x86
            python_version: "3.11"
          - os: ubuntu-latest
            artifact_suffix: linux_x86_64
            python_version: "3.11"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python_version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[ui]"

      - name: Get version from tag
        id: version
        shell: bash
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Build
        run: python ui/main/build_exe.py --version ${{ steps.version.outputs.VERSION }}

      - name: Rename zip for platform
        shell: bash
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}
          VERSION_UNDERSCORE=${VERSION//./_}
          SRC="ui/main/dist/RoundnetMatchmaking_${VERSION_UNDERSCORE}.zip"
          DST="ui/main/dist/RoundnetMatchmaking_${VERSION_UNDERSCORE}_${{ matrix.artifact_suffix }}.zip"
          mv "$SRC" "$DST"
          echo "ZIP_PATH=$DST" >> $GITHUB_ENV

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ZIP_PATH }}
          token: ${{ secrets.GITHUB_TOKEN }}
