name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]
    env:
      MPLBACKEND: Agg
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run script-based validation suite
        run: python tests/run_script_tests.py

      - name: Run pytest-native suite (if present)
        run: |
          set +e
          pytest -q
          status=$?
          set -e
          if [ "$status" -eq 0 ] || [ "$status" -eq 5 ]; then
            echo "pytest completed with status $status (0=tests passed, 5=no tests collected)."
            exit 0
          fi
          echo "pytest failed with status $status"
          exit "$status"
