[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "roundnet-matchmaking"
version = "1.2.0"
description = "Desktop roundnet matchmaking and session generation tool"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "RoundnetMatchmaking Maintainers" }]
keywords = ["roundnet", "matchmaking", "scheduling", "sports"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: MacOS X",
    "Environment :: Win32 (MS Windows)",
    "Environment :: X11 Applications",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
]
dependencies = [
    "numpy>=1.24.0",
    "pandas>=1.5.0",
    "matplotlib>=3.7.0",
    "openpyxl>=3.1.0",
    "Pillow>=10.0.0",
    "seaborn>=0.12.0",
    "networkx>=3.0",
    "Unidecode>=1.3.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "black>=24.0",
    "flake8>=7.0",
    "pre-commit>=3.7.0",
]
ui = [
    "pyinstaller>=5.13.0",
]

[project.scripts]
roundnet-matchmaking = "ui.main.roundnet_matchmaking_ui:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "ui*"]
exclude = ["tests*", "archive*", "fusion_xlsx*"]

[tool.setuptools.package-data]
ui = ["*.png", "*.ico"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
# tests_fine_tuning.py is a script-style file with no test functions and
# requires real .xlsx data — excluded from pytest collection
collect_ignore = [
    "tests/tests_fine_tuning.py",
]
