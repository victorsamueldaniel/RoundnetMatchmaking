[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "roundnet-matchmaking"
version = "0.1.0"
description = "Desktop roundnet matchmaking and session generation tool"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "RoundnetMatchmaking Maintainers" }]
dependencies = [
    "numpy>=1.24.0",
    "pandas>=1.5.0",
    "matplotlib>=3.7.0",
    "openpyxl>=3.1.0",
    "pyperclip>=1.8.2",
    "Pillow>=10.0.0",
    "seaborn>=0.12.0",
    "networkx>=3.0",
    "Unidecode>=1.3.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "black>=24.0",
    "flake8>=7.0",
]
ui = [
    "pyinstaller>=5.13.0",
]

[project.scripts]
roundnet-matchmaking = "ui.player_selection_ui:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "ui*"]
exclude = ["tests*", "archive*", "fusion_xlsx*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
